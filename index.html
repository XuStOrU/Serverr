<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lolz Deals — Отзывы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #141816;
      --card: #1e2420;
      --card2: #2a322c;
      --text: #ffffff;
      --text-secondary: #8a9a8e;
      --green: #7dcf8a;
      --green-soft: #5a9a66;
      --green-btn: #6bcf7c;
      --green-bar: #6bbf78;
      --star: #f5c542;
      --star-empty: #4a554c;
      --border: rgba(125, 207, 138, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px 16px 40px;
    }

    /* subtle green gradient overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at top, rgba(125, 207, 138, 0.06) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.5px;
      text-shadow: 0 0 18px rgba(125, 207, 138, 0.35);
    }

    .brand-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .rating-card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 0 24px rgba(125, 207, 138, 0.06);
    }

    .rating-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .rating-score {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
    }

    .rating-score span {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .rating-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stars-row {
      display: flex;
      gap: 2px;
    }

    .star {
      color: var(--star);
      font-size: 16px;
    }

    .reviews-count {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .bar-label {
      width: 28px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
    }

    .bar-star {
      color: var(--star);
      font-size: 11px;
    }

    .bar-track {
      flex: 1;
      height: 7px;
      background: var(--card2);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #5a9a66, var(--green-bar));
      border-radius: 4px;
      transition: width 0.85s cubic-bezier(0.22, 0.61, 0.36, 1);
      box-shadow: 0 0 8px rgba(107, 191, 120, 0.4);
    }

    .bar-count {
      width: 42px;
      text-align: right;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .your-review {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .your-review h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .your-review .note {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .your-review .note a {
      color: var(--green);
      text-decoration: none;
    }

    .field-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .stars-select {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 28px;
      cursor: pointer;
    }

    .stars-select .s {
      color: var(--star-empty);
      transition: color 0.15s;
    }

    .stars-select .s.active {
      color: var(--star);
    }

    .input-field {
      background: var(--card2);
      border: 1px solid rgba(125, 207, 138, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 16px;
      width: 100%;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: rgba(125, 207, 138, 0.4);
    }

    .input-field::placeholder {
      color: var(--text-secondary);
    }

    textarea.input-field {
      min-height: 80px;
      resize: none;
      font-family: inherit;
    }

    .btn-publish {
      width: 100%;
      background: #6bcf7c;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, background 0.15s;
      box-shadow: none;
      letter-spacing: 0.2px;
    }

    .btn-publish:active {
      opacity: 0.85;
      background: #5bb86c;
    }

    .already-reviewed {
      color: var(--green);
      font-size: 15px;
      font-weight: 500;
      margin-top: 8px;
    }

    .all-reviews-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 12px;
      font-size: 17px;
      font-weight: 600;
    }

    .all-reviews-header .count {
      background: rgba(125, 207, 138, 0.15);
      color: var(--green);
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid rgba(125, 207, 138, 0.25);
    }

    .review-item {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .review-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .review-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .review-avatar svg {
      width: 16px;
      height: 14px;
    }

    .review-name {
      font-size: 15px;
      font-weight: 600;
    }

    .review-stars {
      display: flex;
      gap: 1px;
      font-size: 12px;
      color: var(--star);
      flex-shrink: 0;
    }

    .review-text {
      font-size: 14px;
      line-height: 1.4;
      color: #e0e0e0;
      margin-bottom: 6px;
    }

    .review-date {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c2c2e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  
    .brand-logo {
      width: 40px;
      height: 30px;
      object-fit: contain;
      display: block;
    }
    .review-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .review-avatar-img {
      width: 22px;
      height: 16px;
      object-fit: contain;
    }

  </style>
</head>

    const SUFFIXES = ["", " ★", " 🦋", " ✨", " 🔥", " | 3%", " | tg", " | deals", " | otc", " | 5%", " | NFT"];

    // Простой seeded RNG
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const MONTHS = ['янв.','февр.','мар.','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];

    function makeDateObj(rand) {
      // от 1 сент 2025 до 21 авг 2026, bias к свежим
      const start = new Date(2025, 8, 1).getTime();
      const end = new Date(2026, 7, 21).getTime();
      const t = Math.pow(rand(), 0.42); // больше свежих
      const ts = end - t * (end - start);
      const d = new Date(ts);
      const label = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ' г.';
      return { ts, label };
    }

    function generateAllReviews(total) {
      const rnd = mulberry32(20260821);
      const list = [];
      for (let i = 0; i < total; i++) {
        let name = NAME_POOL[Math.floor(rnd() * NAME_POOL.length)];
        if (rnd() < 0.22) {
          const s = SUFFIXES[Math.floor(rnd() * SUFFIXES.length)];
          if (s && !name.includes(s.trim().replace('|','').trim().slice(0,2))) name += s;
        }
        if (rnd() < 0.12) name += String(Math.floor(rnd() * 9000) + 100);
        const text = TEXT_POOL[Math.floor(rnd() * TEXT_POOL.length)];
        const stars = rnd() < 0.97 ? 5 : (rnd() < 0.7 ? 4 : 5);
        const { ts, label } = makeDateObj(rnd);
        list.push({ name, text, date: label, stars, _ts: ts });
      }
      // строго: сверху новые (2026), внизу старые (2025)
      list.sort((a, b) => b._ts - a._ts);
      return list;
    }

    function renderReviews(reset) {
      const list = document.getElementById('reviewsList');
      if (reset) {
        list.innerHTML = '';
        renderedCount = 0;
      }
      const next = reviews.slice(renderedCount, renderedCount + BATCH);
      list.insertAdjacentHTML('beforeend', next.map(reviewCard).join(''));
      renderedCount += next.length;

      let moreBtn = document.getElementById('loadMoreBtn');
      if (renderedCount < reviews.length) {
        if (!moreBtn) {
          moreBtn = document.createElement('button');
          moreBtn.id = 'loadMoreBtn';
          moreBtn.className = 'btn-publish';
          moreBtn.style.marginTop = '12px';
          moreBtn.style.background = 'var(--card2)';
          moreBtn.style.boxShadow = 'none';
          moreBtn.onclick = () => renderReviews(false);
          list.parentNode.insertBefore(moreBtn, list.nextSibling);
        }
        moreBtn.style.display = 'block';
        moreBtn.textContent = 'Показать ещё (' + (reviews.length - renderedCount).toLocaleString('ru-RU') + ')';
      } else if (moreBtn) {
        moreBtn.style.display = 'none';
      }
    }

    function publishReview() {
      if (hasReviewed) return;
      const nick = document.getElementById('nickname').value.trim() || 'Аноним';
      const text = document.getElementById('reviewText').value.trim();
      if (!selectedStars) {
        showToast('Выберите оценку');
        return;
      }
      if (!text) {
        showToast('Напишите текст отзыва');
        return;
      }

      const today = new Date();
      const months = ['янв.', 'фев.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сен.', 'окт.', 'ноя.', 'дек.'];
      const dateStr = `${today.getDate()} ${months[today.getMonth()]} ${today.getFullYear()} г.`;
      
      reviews.unshift({
        name: nick,
        text: text,
        date: dateStr,
        stars: selectedStars
      });

      document.getElementById('totalCount').textContent = (reviews.length).toLocaleString('ru-RU');
      renderReviews(true);

      document.getElementById('reviewForm').innerHTML = `
        <h3>Ваш отзыв</h3>
        <div class="note">Виден только вам · поддержка <a href="https://t.me/Lolzdeals_supports">@Lolzdeals_supports</a></div>
        <div class="already-reviewed">Спасибо! Вы уже оставили отзыв.</div>
      `;

      hasReviewed = true;
      showToast('Спасибо! Отзыв сохранён');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    renderReviews();
  </script>
