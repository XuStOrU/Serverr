<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Расtа Sтаndoff2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #eef2ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        /* ===== ОСНОВНЫЕ АНИМАЦИИ ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px rgba(47, 128, 237, 0.3); }
            50% { box-shadow: 0 0 30px rgba(47, 128, 237, 0.8); }
            100% { box-shadow: 0 0 10px rgba(47, 128, 237, 0.3); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            max-width: 480px;
            width: 100%;
            background: #1a1a2a;
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #2e3a5e;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease-out;
            transition: all 0.3s ease;
        }

        /* ===== ЛОГОТИП С АНИМАЦИЕЙ ===== */
        .logo {
            font-size: 72px;
            margin-bottom: 12px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.3s ease;
        }
        .logo:hover {
            animation: shake 0.5s ease;
        }

        /* ===== ЗАГОЛОВОК С ГРАДИЕНТОМ ===== */
        .title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd966, #ffaa33);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 24px;
            animation: fadeIn 0.8s ease-out;
        }

        /* ===== СТАТИСТИКА С АНИМАЦИЕЙ ===== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .stat-card {
            background: #0e0e1a;
            border-radius: 16px;
            padding: 14px 8px;
            border: 1px solid #2a2a3a;
            transition: all 0.3s ease;
            cursor: default;
            animation: bounceIn 0.6s ease-out;
            animation-fill-mode: both;
        }
        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }

        .stat-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: #3a5a8a;
            box-shadow: 0 8px 24px rgba(47, 128, 237, 0.2);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #ffd966;
            transition: all 0.3s ease;
        }
        .stat-card:hover .stat-value {
            color: #ffaa33;
            transform: scale(1.1);
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
            transition: color 0.3s ease;
        }
        .stat-card:hover .stat-label {
            color: #9ca3af;
        }

        /* ===== КНОПКИ ===== */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 12px;
            position: relative;
            overflow: hidden;
        }

        /* ЭФФЕКТ ВОЛНЫ ПРИ НАЖАТИИ */
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* ГЛАВНАЯ КНОПКА */
        .btn-primary {
            background: linear-gradient(135deg, #2f80ed, #3aa3ff);
            animation: glow 2s ease-in-out infinite;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(47, 128, 237, 0.4);
        }

        /* ВТОРИЧНЫЕ КНОПКИ */
        .btn-secondary {
            background: #2a2a3a;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: #3a3a4a;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .btn-secondary:active {
            transform: scale(0.95);
        }

        /* СПЕЦИАЛЬНЫЙ ЭФФЕКТ ДЛЯ КНОПКИ "ИГРАТЬ" */
        .btn-play {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }
        .btn-play:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 30px rgba(238, 90, 36, 0.4);
        }

        /* ===== ФУТЕР ===== */
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #4a4a5a;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        .footer:hover {
            opacity: 1;
        }

        /* ===== ЗАГРУЗОЧНЫЙ СПИННЕР ===== */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: rotateSlow 0.8s linear infinite;
            margin-right: 8px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 420px) {
            .container { padding: 20px 16px; }
            .title { font-size: 22px; }
            .logo { font-size: 56px; }
            .stat-value { font-size: 18px; }
            .btn { font-size: 16px; padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЛОГОТИП С АНИМАЦИЕЙ ПАРЕНИЯ -->
        <div class="logo">⚔️</div>

        <!-- ЗАГОЛОВОК С SHIMMER ЭФФЕКТОМ -->
        <div class="title">Расtа Sтаndoff2</div>
        <div class="subtitle">Сезон #2 • 543.23</div>

        <!-- СТАТИСТИКА С АНИМАЦИЕЙ ПОЯВЛЕНИЯ -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value">1,234</div>
                <div class="stat-label">⭐ Stars</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">5.42</div>
                <div class="stat-label">⧫ TON</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">7</div>
                <div class="stat-label">🎁 Подарки</div>
            </div>
        </div>

        <!-- КНОПКИ С РАЗНЫМИ ЭФФЕКТАМИ -->
        <button class="btn btn-play" id="playBtn">
            <span class="spinner" style="display:none;" id="playSpinner"></span>
            🎮 Играть
        </button>
        <button class="btn btn-primary" id="shopBtn">🛒 Магазин</button>
        <button class="btn btn-secondary" id="profileBtn">👤 Профиль</button>

        <div class="footer">@basex8431l2s_bot • v2.0</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        function sendToBot(action, data = {}) {
            if (tg) {
                tg.sendData(JSON.stringify({ action, ...data }));
            }
        }

        // ===== АНИМАЦИЯ ЗАГРУЗКИ ПРИ НАЖАТИИ =====
        document.getElementById('playBtn').addEventListener('click', function(e) {
            const spinner = document.getElementById('playSpinner');
            spinner.style.display = 'inline-block';
            this.innerHTML = '⏳ Загрузка...';
            this.disabled = true;

            setTimeout(() => {
                sendToBot('play');
                if (tg) tg.close();
            }, 800);
        });

        document.getElementById('shopBtn').addEventListener('click', function(e) {
            // ЭФФЕКТ ПУЛЬСАЦИИ ПРИ НАЖАТИИ
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
                sendToBot('shop');
                if (tg) tg.close();
            }, 200);
        });

        document.getElementById('profileBtn').addEventListener('click', function(e) {
            // ЭФФЕКТ СВЕЧЕНИЯ
            this.style.boxShadow = '0 0 30px rgba(47, 128, 237, 0.6)';
            setTimeout(() => {
                this.style.boxShadow = '';
                sendToBot('profile');
                if (tg) tg.close();
            }, 300);
        });

        // ===== АНИМАЦИЯ ПРИ НАВЕДЕНИИ НА СТАТИСТИКУ (для десктопа) =====
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transition = 'all 0.3s ease';
            });
        });

        console.log('[SWILL] WebApp с анимациями загружен!');
    </script>
</body>
</html>
